{% extends 'app_base.html' %}
{% block page_title %}Delete {{ resource.label }}{% endblock %}

{% block app_content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card-app text-center">
      <div class="feature-icon mx-auto" style="background:linear-gradient(135deg,#ef4444,#f97316);"><i class="bi bi-trash3"></i></div>
      <h5 class="fw-bold mt-3">Delete {{ resource.label }}</h5>
      <p class="muted">Delete <strong>{{ object }}</strong>? This cannot be undone.</p>
      <form method="post" class="d-flex gap-2 justify-content-center">
        {% csrf_token %}
        <button class="btn-app" style="background:linear-gradient(135deg,#ef4444,#f97316);" type="submit"><i class="bi bi-trash3"></i> Yes, Delete</button>
        <a href="{% url 'manage_panel:resource_list' slug=resource.slug %}" class="btn-ghost">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
