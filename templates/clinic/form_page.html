{% extends 'app_base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Fill in the details below{% endblock %}

{% block app_content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card-app">
      <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-gradient"></i> {{ title }}</h5>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include 'partials/_form.html' with form=form %}
        <div class="d-flex gap-2 mt-2">
          <button class="btn-app" type="submit"><i class="bi bi-check2"></i> Save</button>
          <a href="javascript:history.back()" class="btn-ghost"><i class="bi bi-arrow-left"></i> Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
